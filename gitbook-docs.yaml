$schema: https://api.gitbook.com/gitbook-docs.yaml
version: 1
site:
  title: 송림소년부 JoyGrow 공식 가이드
  structure:
    - type: space
      key: space-joygrow-docs
      title: 송림소년부 JoyGrow 공식 가이드
      path: joygrow-docs
      default: true
      content:
        directory: .
    - type: space
      key: space-joygrow-ministry-ops
      title: JoyGrow 교역자 운영 노트
      path: ministry-operations
      content:
        directory: ./ministry-admin
    - type: space
      key: space-attendance-admin
      title: 송림소년부 출석부 관리자 공식 가이드
      path: attendance-admin
      content:
        directory: ./attendance-admin
    - type: space
      key: space-joygrow-student-guide
      title: JoyGrow 주인공 안내
      path: student-guide
      content:
        directory: ./student-guide
